# Verified against: uv 0.11.25.
# uv 0.11.25 (checked against `uv --help` and the help of every subcommand). Complete: uv runs no
# external subcommands, so an unknown subcommand is an error, at the top level and in the groups
# `auth`, `cache`, `pip`, `python`, `self`, `tool`, and `workspace`. The hidden commands `clean`,
# `generate-shell-completion`, and `build-backend` (whose hook subcommands are not listed) and
# `auth helper` are included. The global, cache, and Python options of `uv --help` are common
# options, so they are known before and after the subcommand, and their values are not taken for
# the subcommand. `run` and `tool run` stop option parsing at the command to run.
