# Verified against: util-linux 2.41.3.
# chrt(1) from util-linux: `chrt [OPTION]... PRIORITY COMMAND [ARG]...`. `-e` and `--ext` are absent
# from 2.41.3: they are not in its help or manual page, and chrt 2.41.3 rejects them. They are
# declared but were not verified, so `--e` and `--ex` resolve to `--ext` here although chrt 2.41.3
# rejects them.
name = "chrt"
option-abbreviations = true
precommand = true
positional = 1
options = [
  "-a", "--all-tasks",
  "-b", "--batch",
  "-d", "--deadline",
  "-e", "--ext",
  "-f", "--fifo",
  "-i", "--idle",
  "-o", "--other",
  "-r", "--rr",
  "-R", "--reset-on-fork",
  "-T=", "--sched-runtime=",
  "-P=", "--sched-period=",
  "-D=", "--sched-deadline=",
  "-m", "--max",
  "-p", "--pid",
  "-v", "--verbose",
  "-h", "--help",
  "-V", "--version",
]
