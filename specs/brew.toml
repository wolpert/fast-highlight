# Verified against: Homebrew 7.0.8.
# brew(1), Homebrew 7.0.8 (brew is not installed here). The commands, aliases, and option names come
# from the manual page of that release (docs/Manpage.md), and which options take a value from the
# command definitions in its Library/Homebrew sources (`flag` and `comma_array` take a value,
# `switch` does not). The top level is not complete: brew runs any external command `brew-NAME` on
# PATH and the commands of taps, so an unknown subcommand there is not an error. The only
# complete group is `brew services`, whose subcommands and aliases are fixed. The `bundle`,
# `analytics`, `completions`, and `developer` subcommands are listed but their groups are not
# complete. The dashed commands (`--cache`, `--prefix`, `--env`, ...) and `-S` are options here,
# since a word that starts with `-` is never a subcommand. `-d`, `-q`, `-v`, and `-h` are common
# options. The cask directory options of the manual page are declared for `install`, `reinstall`,
# and `upgrade`.
name = "brew"
common-options = ["-d", "--debug", "-q", "--quiet", "-v", "--verbose", "-h", "--help"]
options = [
  "--cache", "--caskroom", "--cellar", "--env", "--prefix", "--repository", "--repo", "--taps",
  "--version", "--config", "-S",
]

