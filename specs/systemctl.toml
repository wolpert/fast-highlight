# Verified against: systemd 259 (only `sleep` was compared; `enqueue-marked-jobs` was checked and does not exist).
# systemctl(1). Complete: systemctl has no plugin mechanism, so an unknown verb is an error. The
# list includes the compatibility verbs systemctl still accepts (`condrestart`, `force-reload`,
# `check`, ...). Options are valid before and after the verb. `sleep` is new in systemd 256
# (systemctl(1)). `enqueue-marked-jobs` is not a verb: systemd 259 rejects it as an unknown verb and
# its manual page does not list it. Marked units are enqueued with `reload-or-restart --marked`.
name = "systemctl"
complete = true
common-options = [
  "-h", "--help", "--version",
  "--system", "--user", "--global", "-C=", "--capsule=", "-M=", "--machine=", "-H=", "--host=",
  "-t=", "--type=", "--state=", "--failed", "-p=", "--property=", "-P=", "-a", "--all",
  "-l", "--full", "-r", "--recursive", "--reverse", "--after", "--before",
  "--with-dependencies", "--job-mode=", "-T", "--show-transaction", "--show-types", "--value",
  "--check-inhibitors=", "-i", "--ignore-inhibitors", "-s=", "--signal=", "--kill-whom=",
  "--kill-value=", "--what=", "--now", "-q", "--quiet", "--no-warn", "--wait", "--no-block",
  "--no-wall", "--no-reload", "--no-legend", "--legend=", "--no-pager", "--no-ask-password",
  "--runtime", "-f", "--force", "--preset-mode=", "--root=", "--image=", "--image-policy=",
  "--reboot-argument=", "--plain", "--timestamp=", "--mkdir", "--marked", "--read-only",
  "--firmware-setup", "--boot-loader-menu=", "--boot-loader-entry=", "-n=", "--lines=",
  "-o=", "--output=", "--drop-in=", "--when=", "--stdin", "--message=", "--dry-run",
]

