# env(1), GNU coreutils and BSD. A bare `-` is the same as `-i`.
name = "env"
precommand = true
skip-assignments = true
options = [
  "-", "-i", "--ignore-environment",
  "-0", "--null",
  "-u=", "--unset=",
  "-C=", "--chdir=",
  "-S=", "--split-string=",
  "-P=",
  "-L=",
  "-v", "--debug",
  "-a=", "--argv0=",
  "--block-signal=?", "--default-signal=?", "--ignore-signal=?", "--list-signal-handling",
  "--help", "--version",
]
