# Verified against: GNU coreutils 9.7 and uutils coreutils 0.10.0.
# env(1), GNU coreutils and BSD. A bare `-` is the same as `-i`. The BSD options `-P` and `-L` are
# not in GNU env and were not compared. `NAME=value` words before the command are skipped, also
# when the value contains an expansion (`FOO=$x`).
# `env` on PATH may be uutils rather than GNU; both accept the same unique prefixes of the long
# options declared here (`--ignore-e`) and reject an ambiguous one (`--i`, which matches
# `--ignore-environment` and `--ignore-signal`).
# uutils env also has `--file`, which is not declared.
name = "env"
option-abbreviations = true
precommand = true
skip-assignments = true
options = [
  "-", "-i", "--ignore-environment",
  "-0", "--null",
  "-u=", "--unset=",
  "-C=", "--chdir=",
  "-S=", "--split-string=",
  "-P=",
  "-L=",
  "-v", "--debug",
  "-a=", "--argv0=",
  "--block-signal=?", "--default-signal=?", "--ignore-signal=?", "--list-signal-handling",
  "--help", "--version",
]
