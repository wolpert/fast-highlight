  "--authfile=", "--compatible", "--creds=", "-f=", "--filter=", "--format=", "--limit=",
  "--list-tags", "--no-trunc", "--tls-verify", "--cert-dir=",
]

[subcommands.secret]
complete = true

[subcommands.secret.subcommands.create]
options = [
  "-d=", "--driver=", "--driver-opts=", "--env", "--ignore", "-l=", "--label=", "--replace",
]

[subcommands.secret.subcommands.exists]

[subcommands.secret.subcommands.inspect]
options = ["-f=", "--format=", "--pretty", "--showsecret"]

[subcommands.secret.subcommands.ls]
aliases = ["list"]
options = ["-f=", "--filter=", "--format=", "-n", "--noheading", "-q", "--quiet"]

[subcommands.secret.subcommands.rm]
options = ["-a", "--all", "-i", "--ignore"]

[subcommands.start]
options = [
  "--all", "-a", "--attach", "--detach-keys=", "-f=", "--filter=", "-i", "--interactive",
  "--latest", "-l", "--sig-proxy",
]

[subcommands.stats]
options = [
  "-a", "--all", "--format=", "-i=", "--interval=", "--no-reset", "--no-stream", "--no-trunc",
  "--latest", "-l",
]

[subcommands.stop]
options = [
  "-a", "--all", "-f=", "--filter=", "-t=", "--time=", "--cidfile=", "--ignore", "-i", "--latest",
  "-l",
]

[subcommands.system]
complete = true

[subcommands.system.subcommands.check]
options = ["-f", "--force", "-m=", "--max=", "-q", "--quick", "-r", "--repair"]

[subcommands.system.subcommands.connection]
complete = true

[subcommands.system.subcommands.connection.subcommands.add]
options = [
  "-d", "--default", "--identity=", "-p=", "--port=", "--socket-path=", "--tls-ca=", "--tls-cert=",
  "--tls-key=",
]

[subcommands.system.subcommands.connection.subcommands.default]

[subcommands.system.subcommands.connection.subcommands.list]
aliases = ["ls"]
options = ["-f=", "--format=", "-q", "--quiet"]

[subcommands.system.subcommands.connection.subcommands.remove]
aliases = ["rm"]
options = ["-a", "--all"]

[subcommands.system.subcommands.connection.subcommands.rename]
aliases = ["mv"]

[subcommands.system.subcommands.df]
options = ["--format=", "-v", "--verbose"]

[subcommands.system.subcommands.events]
options = ["-f=", "--filter=", "--format=", "--no-trunc", "--since=", "--stream", "--until="]

[subcommands.system.subcommands.info]
options = ["-f=", "--format="]

[subcommands.system.subcommands.migrate]
options = ["--migrate-db", "--new-runtime="]

[subcommands.system.subcommands.prune]
options = ["-a", "--all", "--build", "--external", "--filter=", "-f", "--force", "--volumes"]

[subcommands.system.subcommands.renumber]

[subcommands.system.subcommands.reset]
options = ["-f", "--force"]

[subcommands.system.subcommands.service]
options = ["--cors=", "-t=", "--time=", "--tls-cert=", "--tls-client-ca=", "--tls-key="]

[subcommands.tag]

[subcommands.top]
options = ["--latest", "-l"]

[subcommands.unmount]
aliases = ["umount"]
options = ["-a", "--all", "-f", "--force", "-l", "--latest"]

[subcommands.unpause]
options = ["-a", "--all", "-f=", "--filter=", "--cidfile=", "--latest", "-l"]

[subcommands.unshare]
options = ["--rootless-netns"]

[subcommands.untag]

[subcommands.update]
options = [
  "--blkio-weight=", "--blkio-weight-device=", "--cpu-period=", "--cpu-quota=", "--cpu-rt-period=",
  "--cpu-rt-runtime=", "-c=", "--cpu-shares=", "--cpus=", "--cpuset-cpus=", "--cpuset-mems=",
  "--device-read-bps=", "--device-read-iops=", "--device-write-bps=", "--device-write-iops=", "-e=",
  "--env=", "--health-cmd=", "--health-interval=", "--health-log-destination=",
  "--health-max-log-count=", "--health-max-log-size=", "--health-on-failure=", "--health-retries=",
  "--health-start-period=", "--health-startup-cmd=", "--health-startup-interval=",
  "--health-startup-retries=", "--health-startup-success=", "--health-startup-timeout=",
  "--health-timeout=", "-m=", "--memory=", "--memory-reservation=", "--memory-swap=",
  "--memory-swappiness=", "--no-healthcheck", "--pids-limit=", "--restart=", "--ulimit=",
  "--unsetenv=", "--latest", "-l",
]

[subcommands.version]
options = ["-f=", "--format="]

[subcommands.volume]
complete = true

[subcommands.volume.subcommands.create]
options = ["-d=", "--driver=", "--gid=", "--ignore", "-l=", "--label=", "-o=", "--opt=", "--uid="]

[subcommands.volume.subcommands.exists]

[subcommands.volume.subcommands.export]
options = ["-o=", "--output="]

[subcommands.volume.subcommands.import]

[subcommands.volume.subcommands.inspect]
options = ["-a", "--all", "-f=", "--format="]

[subcommands.volume.subcommands.ls]
aliases = ["list"]
options = ["-f=", "--filter=", "--format=", "-n", "--noheading", "-q", "--quiet"]

[subcommands.volume.subcommands.mount]

[subcommands.volume.subcommands.prune]
options = ["-a", "--all", "--dry-run", "--filter=", "-f", "--force"]

[subcommands.volume.subcommands.reload]

[subcommands.volume.subcommands.rename]

[subcommands.volume.subcommands.rm]
aliases = ["remove"]
options = ["-a", "--all", "-f", "--force", "-t=", "--time="]

[subcommands.volume.subcommands.unmount]
aliases = ["umount"]

[subcommands.wait]
options = ["--condition=", "--exit-first-match", "--ignore", "-i=", "--interval=", "--latest", "-l"]
