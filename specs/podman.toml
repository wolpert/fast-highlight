# Verified against: podman 6.1.3.
# podman(1), Podman 6.1.3. The command tree, aliases, and option types come from the help of the
# podman-remote 6.1.3 binary; the commands and options that only the local Podman has (`mount`,
# `unmount`, `unshare`, `auto-update`, `completion`, `system service`, `--latest`, and the
# storage options) come from the podman(1) manual pages of the 6.1.3 source tree. Complete: Podman
# has no external subcommands, so an unknown subcommand is an error, at the top level and in every
# command group. The global options of podman(1) are declared where they are valid: those that
# apply before the subcommand only at the top level, and the persistent ones everywhere. `run`,
# `create`, and `exec` stop option parsing at the image or container name, so the command after
# it is plain.
