# Verified against: gh 2.102.0.
# gh(1), GitHub CLI 2.102.0, from the output of `gh help reference` of that release (the gh
# installed here is 2.46.0, which predates several commands). The top level is not complete:
# `gh NAME` also runs extensions installed with `gh extension install` and aliases from
# `gh alias set`, so an unknown subcommand there is not an error. The command groups (`gh pr`,
# `gh issue`, `gh repo`, ...) have a fixed set of subcommands, and extensions and aliases apply
# only at the top level, so an unknown subcommand in a group is an error. The flags that a group
# declares for its subcommands, such as `-R/--repo` of `gh pr`, are declared on the group and on
# each of its subcommands, since a level inherits no options. The `-R/--repo` override is not in
# `gh help reference` for the commands that inherit it; the commands that have it were found in the
# cli/cli sources of v2.102.0 (`EnableRepoOverride`).
