# Verified against: dnf5 5.4.6.
# dnf5(8) 5.4.6 (checked against the DNF5 manual pages and compatibility alias files of tag 5.4.6.0;
# dnf is not installed here). `dnf` is dnf5 on current Fedora, so `dnf5` is an alias; DNF 4 (`yum`)
# is not covered. The top level is not complete: `dnf NAME` also runs plugins from other packages
# and aliases defined in `/etc/dnf/dnf5-aliases.d`, so an unknown subcommand there is not an error.
# The commands with a fixed set of subcommands (`group`, `environment`, `history`, `module`,
# `repo`, ...) are complete. The `dnf5-plugins` commands are listed. Each command declares the
# options of its manual page, and the subcommands of a command group declare none. The global
# options, with their DNF 4 spellings such as `--enablerepo`, are common options, so a value after
# one of them is not taken for the subcommand. A manual page that describes an option value only in
# prose is read as a flag, except for `--hub`, `--input`, `--manifest`, `--arch`, and
# `--urlprotocol`.
name = "dnf"
aliases = ["dnf5"]
common-options = [
  "--assumeno", "--allow-vendor-change", "--best", "-C", "--cacheonly", "--comment=", "--config=",
  "--debugsolver", "--disable-plugin=", "--disable-repo=", "--dump-main-config",
  "--dump-repo-config=", "--dump-variables", "--enable-plugin=", "--enable-repo=", "--forcearch=",
  "-h", "--help", "--installroot=", "--no-allow-vendor-change", "--no-best", "--no-docs",
  "--no-gpgchecks", "--no-plugins", "-q", "--quiet", "--refresh", "--color=", "--repo=",
  "--repofrompath=", "--releasever=", "--releasever-major=", "--releasever-minor=", "--setopt=",
  "--setvar=", "--skip-file-locks", "--show-new-leaves", "--use-host-config", "--version", "-y",
  "--assumeyes", "-x=", "--exclude=", "-c=", "--nobest", "--nodocs", "--enablerepo=",
  "--disablerepo=", "--repoid=", "--nogpgcheck", "--noplugins", "--enableplugin=",
  "--disableplugin=",
]

