# Verified against: GNU coreutils 9.7 and uutils coreutils 0.10.0.
# stdbuf(1).
# `stdbuf` on PATH may be uutils rather than GNU; both accept the same unique prefixes of the long
# options declared here (`--vers`).
name = "stdbuf"
option-abbreviations = true
precommand = true
options = [
  "-i=", "--input=",
  "-o=", "--output=",
  "-e=", "--error=",
  "--help", "--version",
]
