# Turns on auto-merge for Dependabot pull requests. The merge itself waits for the required
# `build` check from the CI workflow (branch protection on main), so a Dependabot update only
# lands after CI passes. A failing check leaves the pull request open.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'wolpert/fast-highlight'
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
